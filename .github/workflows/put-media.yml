name: put-media
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag holding the files
        default: social
      items:
        description: 'JSON array of {"file": "...", "url": "<presigned PUT url>", "type": "image/jpeg"}'
        required: true
permissions:
  contents: read
jobs:
  put:
    runs-on: ubuntu-latest
    steps:
      - name: Download from the release and PUT to the presigned URLs
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          TAG: ${{ inputs.tag }}
          ITEMS: ${{ inputs.items }}
        run: |
          set -euo pipefail
          mkdir -p dl && cd dl
          echo "$ITEMS" | jq -c '.[]' | while read -r it; do
            f=$(echo "$it" | jq -r .file); url=$(echo "$it" | jq -r .url); ct=$(echo "$it" | jq -r .type)
            gh release download "$TAG" -R "$REPO" -p "$f" --clobber
            code=$(curl -sS -o /dev/null -w "%{http_code}" -X PUT -H "Content-Type: $ct" --data-binary @"$f" "$url")
            echo "$f : HTTP $code"
            [ "$code" = "200" ]
          done
