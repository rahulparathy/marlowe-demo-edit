name: fetch
on:
  workflow_dispatch:
    inputs:
      items:
        description: 'JSON array of {"url": "...", "name": "..."}'
        required: true
      tag:
        description: Release tag to attach files to
        default: assets
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: Download files and attach them to the release
        env:
          GH_TOKEN: ${{ github.token }}
          ITEMS: ${{ inputs.items }}
          TAG: ${{ inputs.tag }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          gh release view "$TAG" -R "$REPO" >/dev/null 2>&1 || gh release create "$TAG" -R "$REPO" --title "$TAG" --notes "Working assets for the demo video edit"
          echo "$ITEMS" | jq -c '.[]' | while read -r it; do
            url=$(echo "$it" | jq -r .url); name=$(echo "$it" | jq -r .name)
            curl -fSL --retry 3 --retry-delay 5 -o "$name" "$url"
            ls -la "$name"; file "$name" || true
            gh release upload "$TAG" "$name" -R "$REPO" --clobber
          done
