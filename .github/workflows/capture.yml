name: capture
on:
  workflow_dispatch:
    inputs:
      pages:
        description: 'Space-separated paths to capture'
        default: '/ /services /book /waitlist /gift /ask'
permissions:
  contents: write
jobs:
  capture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install Playwright
        run: |
          mkdir cap && cd cap && npm init -y >/dev/null && npm i playwright@1.47.2 >/dev/null
          npx playwright install --with-deps chromium >/dev/null
      - name: Capture full-page screenshots
        env:
          PAGES: ${{ inputs.pages }}
        working-directory: cap
        run: |
          cat > cap.mjs <<'JS'
          import { chromium, devices } from 'playwright';
          const base = 'https://marloweandash.lovable.app';
          const pages = process.env.PAGES.split(/\s+/).filter(Boolean);
          const browser = await chromium.launch();
          const variants = [
            { tag: 'desktop', opts: { viewport: { width: 1440, height: 900 }, deviceScaleFactor: 2 } },
            { tag: 'mobile', opts: { ...devices['iPhone 13'] } },
          ];
          for (const v of variants) {
            const ctx = await browser.newContext({ ...v.opts, reducedMotion: 'reduce', colorScheme: 'light' });
            const page = await ctx.newPage();
            for (const p of pages) {
              const name = (p === '/' ? 'home' : p.replace(/\//g, '')) + '_' + v.tag + '_clean.png';
              await page.goto(base + p, { waitUntil: 'networkidle', timeout: 60000 });
              await page.waitForTimeout(1500);
              // scroll through to trigger lazy content, then back to top
              const h = await page.evaluate(() => document.body.scrollHeight);
              for (let y = 0; y < h; y += 400) { await page.evaluate(yy => window.scrollTo(0, yy), y); await page.waitForTimeout(120); }
              await page.evaluate(() => window.scrollTo(0, 0)); await page.waitForTimeout(800);
              await page.evaluate(() => { for (const el of document.querySelectorAll('body *')) { const cs = getComputedStyle(el); if ((cs.position === 'fixed') && el.getBoundingClientRect().top > 60) el.style.setProperty('display','none','important'); } });
              await page.waitForTimeout(300);
              await page.screenshot({ path: name, fullPage: true });
              console.log('saved', name);
            }
            await ctx.close();
          }
          await browser.close();
          JS
          node cap.mjs
      - name: Attach to release
        env:
          GH_TOKEN: ${{ github.token }}
        working-directory: cap
        run: |
          gh release view captures -R "$GITHUB_REPOSITORY" >/dev/null 2>&1 || gh release create captures -R "$GITHUB_REPOSITORY" --title captures --notes "Live site captures"
          gh release upload captures *.png -R "$GITHUB_REPOSITORY" --clobber
